# ============================================================================
# Nginx SSL(HTTPS) Reverse Proxy 설정 (MCP Streamable HTTP / SSE 최적화)
# ============================================================================

# 1. HTTP (80 포트) -> HTTPS (443 포트) 자동 리다이렉트
server {
    listen 80;
    server_name _;

    location /health {
        proxy_pass http://imanage-mcp:3001/health;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. HTTPS (443 포트) - iManage MCP 메인 엔드포인트
server {
    listen 443 ssl http2;
    # 사내 도메인으로 변경 가능 (예: imanage-mcp.shinkim.com)
    server_name _;

    # ./docker/certs 폴더에 배치할 SSL 인증서 및 개인키 파일
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 대용량 첨부파일 다운로드/업로드 허용
    client_max_body_size 100M;

    # iManage MCP 컨테이너로 전달
    location / {
        proxy_pass http://imanage-mcp:3001;
        proxy_http_version 1.1;

        # 원본 호스트 및 HTTPS 프로토콜 헤더 전달 (OAuth2 Redirect 및 다운로드 링크 자동 생성용)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";

        # MCP Streamable HTTP / SSE 스트리밍 버퍼링 비활성화 (필수)
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;

        # 장시간 AI 에이전트 세션 및 대용량 파일 처리 타임아웃 여유 설정
        proxy_connect_timeout 60s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;
    }
}

